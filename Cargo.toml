[package]
name = "bol"
version = "0.1.0"
edition = "2021"
description = "System-wide dictation powered by Whisper AI — free, offline, private"

[features]
# cargo build --release                    → small.en  (466 MB)
# cargo build --release --features medium  → medium.en (1.5 GB)
medium = []

[dependencies]
whisper-rs = "0.16"
cpal = "0.15"
enigo = "0.2"
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking"] }
indicatif = "0.17"
winit = "0.30"
softbuffer = "0.4"
raw-window-handle = "0.6"
tray-icon = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
